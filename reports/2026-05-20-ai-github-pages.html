<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 日报 GitHub Pages 测试</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5d6878;
      --line: #dbe1ea;
      --accent: #1f7a63;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --panel: #171d23;
        --text: #eef3f8;
        --muted: #a9b4c0;
        --line: #2a333d;
        --accent: #63d6b1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    article h1 { display: none; }
    h2 {
      margin: 24px 0 10px;
      font-size: 20px;
      line-height: 1.35;
      letter-spacing: 0;
    }
    h3 {
      margin: 18px 0 8px;
      font-size: 17px;
      line-height: 1.4;
      letter-spacing: 0;
    }
    p, ul, blockquote { margin: 10px 0; }
    ul { padding-left: 20px; }
    li { margin: 8px 0; }
    a {
      color: var(--accent);
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    blockquote {
      border-left: 3px solid var(--accent);
      color: var(--muted);
      padding-left: 12px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI 日报 GitHub Pages 测试</h1>
      <div class="meta">Generated at 2026-05-20 15:08 CST</div>
    </header>
    <article>
<h1>AI 日报 GitHub Pages 测试</h1>
<h2>官方实验室</h2>
<ul>
<li><a href="https://openai.com/news/">OpenAI News</a>：GitHub Pages 发布链路测试</li>
</ul>
    </article>
  </main>
</body>
</html>
